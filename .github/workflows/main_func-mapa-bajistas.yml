# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - func-mapa-bajistas

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  PYTHON_VERSION: '3.14' # set this to the python version to use (supports 3.6, 3.7, 3.8)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Con el Excel actual de la CNMV las pruebas con datos reales se ejecutan de verdad;
      # si la CNMV no responde, esas pruebas se saltan y el resto sigue
      - name: Download current CNMV file for tests
        run: |
          mkdir -p data/raw
          curl -sSf -A "mapa-bajistas-ci" -o data/raw/NetShortPositions_ci.xls \
            https://www.cnmv.es/DocPortal/Posiciones-Cortas/NetShortPositions.xls || rm -f data/raw/NetShortPositions_ci.xls

      - name: Run tests
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q -rs

      # Las dependencias van dentro del paquete: sin esto la Function no puede importar function_app.py
      - name: Install dependencies into the package
        run: pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Zip artifact for deployment
        run: zip release.zip function_app.py host.json requirements.txt -r src .python_packages -x "*__pycache__*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_588C5CE8A2AC4F0EAE887DB17AB95A93 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_00AA62AB33224576B29F79900C4194B8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C86D6B7AF49346E792845023DC2E58B1 }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'func-mapa-bajistas'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          